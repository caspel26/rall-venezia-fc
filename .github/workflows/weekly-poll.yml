name: Weekly availability poll

# Every morning: if a match was played yesterday, open next week's Mon-Fri availability poll.
# Needs the same repository secrets as the Instagram sync: SITE_URL and CRON_SECRET.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - name: Call the poll endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL / CRON_SECRET not set, skipping"; exit 0; fi
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST "$SITE_URL/api/polls/ensure" -H "x-cron-secret: $CRON_SECRET")
          cat /tmp/out; echo
          [ "$code" = "200" ]
