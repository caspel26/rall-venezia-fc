name: Keep alive

# Twice a day: wakes the site and touches the database so the free Supabase project is never paused for inactivity.
# Needs the repository secret SITE_URL (same as the other schedulers).
on:
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the health endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL not set, skipping"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 10 "$SITE_URL/api/health"
