name: Instagram sync

# Pulls new Instagram posts into the Gazzetta roughly every 15 minutes.
# Needs repository secrets: SITE_URL (https://your-site) and CRON_SECRET (same value as the app's CRON_SECRET).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call the sync endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL / CRON_SECRET not set, skipping"; exit 0; fi
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST "$SITE_URL/api/instagram/sync" -H "x-cron-secret: $CRON_SECRET")
          cat /tmp/out; echo
          # 409 = not connected yet: not a failure
          [ "$code" = "200" ] || [ "$code" = "409" ]
